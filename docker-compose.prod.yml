# Production Compose Profile (Run with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d)

volumes:
  traefik_acme:

services:
  traefik:
    image: traefik:v3.3
    container_name: vestra-traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - traefik_acme:/etc/traefik/acme
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@vestra.com}
    networks:
      - vestra-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway-service:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-vestra.com}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN:-vestra.com}`) || Host(`www.${DOMAIN:-vestra.com}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  product-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  item-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  order-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  payment-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notification-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
