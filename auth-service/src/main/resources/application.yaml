spring:
  cache:
    type: redis
  application:
    name: auth-service
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET}
            scope:
              - profile
              - email
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  main:
    banner-mode: off
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
logging:
  level:
    root: ${LOG_LEVEL:info}
rsa:
  private-key: ${RSA_PRIVATE_KEY:}
  public-key: ${RSA_PUBLIC_KEY:}
  private-key-location: ${RSA_PRIVATE_KEY_LOCATION:}
  public-key-location: ${RSA_PUBLIC_KEY_LOCATION:}

jwt:
  issuer: ${JWT_ISSUER:vestra-auth-service}
  access-token-expiration-in: ${JWT_ACCESS_TOKEN_EXPIRES_IN:${JWT_ACCESS_TOKEN_EXPIRESS_IN:15}}
  refresh-token-expiration-in: ${JWT_REFRESH_TOKEN_EXPIRES_IN:${JWT_REFRESH_TOKEN_EXPIRESS_IN:7}}
  key-id: ${JWT_KEY_ID:auth-key-1}

cookie:
  secure: ${COOKIE_SECURE}
  same-site: ${SAME_SITE}

security:
  login:
    max-attempts: ${SECURITY_LOGIN_MAX_ATTEMPTS}
    lockout-minutes: ${SECURITY_LOCKOUT_MINUTES}

app:
  client-url: ${CLIENT_URL}

server:
  port: ${SERVER_PORT}